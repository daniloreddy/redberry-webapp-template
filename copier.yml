app_name:
  type: str
  help: "Nome applicazione mostrato in UI, titoli pagina e login (es. Mail Manager)"

app_slug:
  type: str
  help: "Slug per cookie/Docker (minuscolo, underscore, no spazi) — invariato di solito"
  default: "{{ app_name.lower().replace(' ', '_').replace('-', '_') }}"

github_owner:
  type: str
  help: "Owner GitHub per l'immagine GHCR (ghcr.io/<owner>/...)"
  default: "daniloreddy"

default_port:
  type: int
  help: "Porta di default (PORT in .env.example, Dockerfile, compose, README) — diversa per ogni progetto sullo stesso host"
  default: 8000

has_api:
  type: bool
  help: "Il progetto espone API fuori da /ui protette da Bearer token (API_TOKENS)? No = niente scripts/generate_token né API_TOKENS in .env.example"
  default: true

_skip_if_exists:
  - "AGENTS.md"
  - "CLAUDE.md"
  - "README.md"
  - "config.example.yaml"

_exclude:
  - "copier.yml"
  - ".git"
  - "data"
  - "__pycache__"
  - "*.pyc"
  - ".pytest_cache"
  - ".ruff_cache"
  - ".mypy_cache"
  - "tools"
  - "venv"
  - ".claude"
  - "scripts/align_to_template.py"
  - "tools"
  - "REPORT.md"
  - "TEMPLATE-NOTES.md"
  - "{% if not has_api %}scripts/generate_token.*{% endif %}"

_envops:
  keep_trailing_newline: true

# Default suffix (.jinja) kept deliberately: .github/workflows/*.yml uses the same
# "${{ }}" delimiter for GitHub Actions expressions, which would collide with Jinja
# if every file were rendered. Only files explicitly suffixed .jinja are templated;
# Copier strips the suffix on output. docker-publish.yml.jinja is one of them
# (wrapped in {% raw %}) so GitHub does not run it on the template repo itself.
